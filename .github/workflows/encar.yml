name: Encar bot

on:
  schedule:
    - cron: "*/15 * * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: encar-bot
  cancel-in-progress: false

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Sprawdź nowe ogłoszenia
        env:
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          SEARCH_URL: ${{ vars.SEARCH_URL }}
        run: python bot.py
      - name: Zapisz listę widzianych ogłoszeń
        run: |
          git config user.name "encar-bot"
          git config user.email "encar-bot@users.noreply.github.com"
          git add seen.json
          git diff --cached --quiet || (git commit -m "Aktualizacja ogłoszeń" && git push)
